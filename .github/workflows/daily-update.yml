name: 每日更新选手准星数据

# 每天北京时间 03:23 跑一次；也可以在 Actions 页面手动触发
on:
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 抓取 prosettings 准星数据
        run: node tools/auto-update.js --no-dist

      - name: 预览改动
        run: git status --porcelain

      - name: 提交并推送（Pages 会随之自动重建）
        run: |
          git config user.name "showkey-bot"
          git config user.email "showkey-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本次没有数据变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 每日准星数据更新 $(date -u '+%Y-%m-%d')"
          git push
